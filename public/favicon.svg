<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Typographic Lyrical Explorer">
  <!--
    A stanza, not a note. The product is about reading words, so the mark is
    four lines of ragged text rather than the musical cliché every lyrics app
    reaches for. Ragged-right on purpose: justified bars would read as a menu
    icon at 16px, and the uneven measure is what makes it legible as writing.
  -->
  <rect width="64" height="64" rx="14" fill="#191a20"/>
  <g fill="#e8623c">
    <rect x="15" y="19" width="34" height="4.5" rx="2.25"/>
    <rect x="15" y="29" width="26" height="4.5" rx="2.25"/>
    <rect x="15" y="39" width="30" height="4.5" rx="2.25"/>
  </g>
  <rect x="15" y="49" width="12" height="4.5" rx="2.25" fill="#6c6f7d"/>
</svg>
